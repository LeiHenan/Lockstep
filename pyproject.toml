[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lockstep"
version = "0.1.0"
description = "Guarding cross-instance KV cache reuse with compiler-derived numerical identities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1"]

[project.entry-points."vllm.general_plugins"]
lockstep = "lockstep.vllm_plugin:register"

[tool.setuptools]
packages = ["lockstep"]

[tool.pytest.ini_options]
testpaths = ["tests"]

